# Contract delta for api/enduser/openapi.yaml (End-User API 1.2.0 -> 1.3.0)
#
# Status: Proposed. Merges into api/enduser/openapi.yaml only after the maintainer's approval
# covers API-DENY, API-READ, API-SYNC, API-DELIVER, and API-VERSION (plan.md, Approval Items).
# Only changed or added members are shown; everything else in the existing document is unchanged.

info:
  version: 1.3.0

paths:
  /api/approvals/deliveries:
    post:
      operationId: claimApprovalDecisionDelivery
      summary: Claim the denied outcome for a repeated tool invocation
      description: |
        Called by ExtProc when the agent repeats a tool invocation whose approval was denied.
        The broker derives the principal and agent from the authenticated subject token and
        atomically claims the newest denied approval of that pair whose tool name and canonical
        arguments hash equal the request, that was never approved, that has not been delivered,
        and whose `expires_at` is in the future. A claimed decision is never claimed again.
        Dual-auth required: subject token + client assertion, as for `POST /api/approvals`.
        The response can contain user-authored text; callers must not log or record it.
      tags:
        - Approvals
      security:
        - BearerSubjectToken: []
          ClientAssertion: []
      parameters:
        - $ref: "#/components/parameters/TraceparentHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryClaimRequest"
            example:
              tool_name: deploy_release
              arguments: { project: production, version: v2.3.0 }
      responses:
        "200":
          description: A denied decision was claimed for this invocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryClaimResponse"
              example:
                data:
                  id: 990e8400-e29b-41d4-a716-446655440020
                  status: denied
                  denied_at: "2026-11-16T10:00:20Z"
                  denial_reason: Use the staging project instead.
                  delivered_at: "2026-11-16T10:00:31Z"
        "204":
          description: No deliverable decision matches this invocation; continue with the normal approval flow.
        "400":
          description: Malformed body, missing `tool_name`, or `arguments` that is not an object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalError"
        "401":
          description: Missing or invalid subject token or client assertion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalError"
        "403":
          description: |
            The subject token is an agent-subject token (`token_exchange.claim_extraction.agent_subject_expression`
            matched, ADR 045 decision 6a). Error code `forbidden`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalError"
        "503":
          description: Subject-token validation or agent-subject detection is unavailable or failed; the request fails closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalError"

  /api/approvals/{id}/deny:
    post:
      description: |
        Transitions a pending approval to denied state.
        With persistence: permanent, blocks the exact tool for this principal and agent
        until revocation, regardless of arguments or session. Clears parameter constraints.
        ExtProc enforces the denial before matching approvals and does not create another approval request.
        An optional `denial_reason` is recorded in the same transition and can never be added,
        changed, or removed afterwards. It is shared with the requesting agent once, when the
        agent repeats the original invocation before `expires_at`.
        Auth: acting user principal from the browser auth layer; principal must match.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DenyRequest"
            examples:
              withReason:
                value: { denial_reason: Use the staging project instead. }
              permanentWithReason:
                value: { persistence: permanent, denial_reason: Wait for the release window. }
      responses:
        "200":
          description: Denial recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DenyResponse"
        "400":
          description: |
            Invalid UUID (`bad_request`), invalid JSON or `persistence` (`bad_request`), or an
            invalid `denial_reason` (`invalid_denial_reason`): not a string, more than 500 Unicode
            code points, contains U+0000, or a request body larger than 16 KiB. The approval is
            unchanged. The error description never repeats the submitted text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalError"
              example:
                error: invalid_denial_reason
                message: denial_reason must be at most 500 characters
        # 401, 403, 404, and 410 are unchanged. A second denial attempt, with or without a
        # different reason, returns the existing 410 and leaves the recorded reason unchanged.

components:
  schemas:
    DenialReason:
      type: string
      minLength: 1
      maxLength: 500
      description: |
        User-authored explanation of a denial, measured in Unicode code points. Untrusted text:
        clients must render it literally and must not interpret it as markup or instructions.
        Never logged or exported as telemetry.

    DenyRequest:
      type: object
      properties:
        persistence:
          type: string
          enum: [permanent]
        denial_reason:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Optional. Omitted, null, empty, or whitespace-only means no reason. Any other value is
            stored exactly as submitted, including surrounding whitespace.

    DenyResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status, denied_at]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [denied] }
            persistence: { type: string, enum: [permanent], nullable: true }
            denied_at: { type: string, format: date-time }
            denial_reason:
              $ref: "#/components/schemas/DenialReason"

    ToolApprovalDetail:
      # Existing schema; one property added.
      properties:
        denial_reason:
          allOf:
            - $ref: "#/components/schemas/DenialReason"
          description: Present only on a denied approval whose owner supplied a reason.

    ToolApprovalSummary:
      # Existing sync schema; two properties added. The reason itself is never synchronized.
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time
          description: End of the pending-review window; also the end of the denied-outcome delivery window.
        denial_delivered_at:
          type: string
          format: date-time
          nullable: true
          description: Time at which the denied outcome was delivered to the requesting agent; absent if undelivered.

    DeliveryClaimRequest:
      type: object
      required: [tool_name, arguments]
      properties:
        tool_name: { type: string, minLength: 1 }
        arguments: { type: object, additionalProperties: true }

    DeliveryClaimResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status, denied_at, delivered_at]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [denied] }
            persistence: { type: string, enum: [permanent], nullable: true }
            denied_at: { type: string, format: date-time }
            denial_reason:
              $ref: "#/components/schemas/DenialReason"
            delivered_at: { type: string, format: date-time }
